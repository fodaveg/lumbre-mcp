# Servicio del transporte HTTP remoto (`mcp.lumbre.pro`, tarea M2).
#
# Se despliega en `/srv/lumbre-mcp` del VPS: allí `deploy/publicar.sh` instala
# este fichero como `compose.yml` (no hay clon del repo ni build en el server)
# y se une a la red Docker externa `edge`, de donde cuelga el Caddy que termina
# TLS (vive en `/srv/edge`; ver `deploy/README-deploy.md`).
#
#   ./deploy/publicar.sh        (desde el Mac o Fedora; ver «Publicar»)
#
# NO publica puertos al host A PROPÓSITO: Caddy lo alcanza por el DNS de la
# red `edge` con el nombre del contenedor (`lumbre-mcp:8787`), igual que hace
# con `lumbre-app:3000`. Publicar 8787 en el host sería un segundo camino de
# entrada, sin TLS y sin las cabeceras del borde, hacia un endpoint que acepta
# tokens.
name: lumbre-mcp

services:
  mcp:
    # La imagen NO se construye en el server: `deploy/publicar.sh` la construye
    # en el Mac (o la reutiliza del registro) y el server la baja por HUELLA
    # (`git.dualhand.com/fodaveg/lumbre-mcp@sha256:…`), que escribe en el `.env`
    # del directorio del servicio y que `deploy/lib/remote-release.sh` inyecta
    # como LUMBRE_MCP_IMAGE al llamar a compose. Sin la variable cae a la
    # etiqueta local de antes del registro (`lumbre-mcp:latest`), así que subir
    # este fichero no cambia lo que corre. El SHA del commit viaja en la
    # etiqueta `org.opencontainers.image.revision` de la imagen.
    image: '${LUMBRE_MCP_IMAGE:-lumbre-mcp:latest}'
    container_name: lumbre-mcp
    restart: unless-stopped
    # `init`: un init mínimo (tini) es el PID 1 y reenvía SIGTERM a Node, que
    # lo atiende con un apagado ordenado de hasta 10 s (`src/http-lifecycle.ts`).
    # Sin él, Node era PID 1, ignoraba la señal y Docker mandaba SIGKILL a
    # los 10 s en cada deploy (H3 de `docs/audit-recuperacion-despliegue-20261010.md`).
    # `stop_grace_period` deja 5 s de margen sobre ese plazo antes del SIGKILL.
    init: true
    stop_grace_period: 15s
    # Techo de memoria (antes, ninguno: compartía los 3,7 GiB del host con
    # Postgres y la app de Lumbre). Medido en `node:22-alpine` el 11 oct 2026
    # con las sondas de `docs/audit-abuso-y-limites-20261010.sondas/`: reposo
    # ~90 MB en la sonda (45-69 MiB en producción); 500 `tools/call`
    # concurrentes con los topes nuevos, ~110 MB; 64 cuerpos de 2 MB a medio
    # llegar, ~225 MB; 32 `add_attachment` de 1 MiB en vuelo, ~320 MB de
    # pico, el peor caso medido. 512 MB deja margen sobre él; por encima, el
    # kernel mata el proceso y `restart` lo levanta.
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      PORT: '8787'
      LUMBRE_BASE_URL: 'https://app.lumbre.pro'
      LUMBRE_APP_BASE_URL: 'https://app.lumbre.pro'
      # Secreto dedicado al backchannel Lumbre<->MCP. Compose aborta antes de
      # crear el contenedor si falta; debe coincidir con el del contenedor Lumbre.
      LUMBRE_MCP_BACKCHANNEL_SECRET: '${LUMBRE_MCP_BACKCHANNEL_SECRET:?define LUMBRE_MCP_BACKCHANNEL_SECRET (minimo 32 caracteres)}'
      # La huella de notas y el store OAuth se escriben bajo
      # `XDG_STATE_HOME/lumbre-mcp`. El volumen es obligatorio: conserva la
      # clave AES-256-GCM estable, los grants y la rotación de refresh tokens
      # entre reinicios, además de la huella de notas. El proceso crea el
      # directorio con 0700 y los ficheros OAuth con 0600.
      #
      # La huella SÍ está segmentada por cuenta (`createAccountNotesSeenStore`,
      # `src/notes.ts`): un fichero `notes-seen-<id>.json` por credencial, con
      # `<id>` derivado del token (nunca la credencial en sí, ni en el nombre
      # ni en el contenido) — así que servir a más de una persona desde este
      # mismo contenedor no mezcla ni expulsa la huella de nadie más. Solo el
      # arranque stdio local (`src/index.ts`, una máquina por usuario) sigue
      # usando el fichero único `notes-seen.json`, sin sufijo.
      XDG_STATE_HOME: /state
      # Topes de `tools/call` en vuelo (global y por credencial). Vacíos =
      # los defectos del código (32 y 8); se cambian sin tocar este fichero,
      # poniéndolos en el `--env-file` del servidor. Ver
      # `deploy/README-deploy.md`, «Límites del transporte».
      LUMBRE_MCP_MAX_TOOL_CALLS: '${LUMBRE_MCP_MAX_TOOL_CALLS:-}'
      LUMBRE_MCP_MAX_TOOL_CALLS_PER_BEARER: '${LUMBRE_MCP_MAX_TOOL_CALLS_PER_BEARER:-}'
      # Login con Sumego. Opcionales: vacías = `lumbre`, el issuer
      # `https://id.sumego.es` y el client_id `lumbre-mcp`. El issuer solo
      # admite `https://id.lumbre.pro` o `https://id.sumego.es`. Con
      # `LUMBRE_MCP_LOGIN_PROVIDER=sumego` el secreto es obligatorio y, si
      # falta, el relé no arranca (causa `oidc_config`). Cambiar el proveedor
      # no corta los grants vivos. Ver `deploy/README-deploy.md`.
      LUMBRE_MCP_LOGIN_PROVIDER: '${LUMBRE_MCP_LOGIN_PROVIDER:-}'
      LUMBRE_MCP_OIDC_ISSUER: '${LUMBRE_MCP_OIDC_ISSUER:-}'
      LUMBRE_MCP_OIDC_CLIENT_ID: '${LUMBRE_MCP_OIDC_CLIENT_ID:-}'
      LUMBRE_MCP_OIDC_CLIENT_SECRET: '${LUMBRE_MCP_OIDC_CLIENT_SECRET:-}'
      # NO hay un `LUMBRE_TOKEN` global aquí. La credencial dedicada del
      # backchannel se persiste cifrada por grant; el bearer OAuth
      # opaco se resolverá localmente y no se reenviará a Lumbre.
    volumes:
      - state:/state
    networks:
      - edge
    healthcheck:
      # `/readyz` valida que store, clave y grants OAuth se pueden leer y
      # descifrar. Deduplica concurrencia y cachea 5 s; Caddy no la publica.
      # `/healthz` queda como liveness barato.
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8787/readyz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      # Durante `start_period` comprueba cada 2 s en vez de cada 30: así un
      # arranque sano pasa a `healthy` en segundos y `publicar.sh`, que lo
      # espera, no tarda medio minuto en dar el deploy por bueno.
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  state:

networks:
  edge:
    external: true
    name: edge
