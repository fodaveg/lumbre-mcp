# Servicio del transporte HTTP remoto (`mcp.lumbre.pro`, tarea M2).
#
# Se despliega en `/srv/lumbre-mcp` del VPS (clon de este repo) y se une a la
# red Docker externa `edge`, que es de donde cuelga el Caddy que termina TLS
# (vive en `/srv/edge`; ver `deploy/README-deploy.md`).
#
#   docker compose -f deploy/compose.yml up -d --build
#
# NO publica puertos al host A PROPÓSITO: Caddy lo alcanza por el DNS de la
# red `edge` con el nombre del contenedor (`lumbre-mcp:8787`), igual que hace
# con `lumbre-app:3000`. Publicar 8787 en el host sería un segundo camino de
# entrada, sin TLS y sin las cabeceras del borde, hacia un endpoint que acepta
# tokens.
name: lumbre-mcp

services:
  mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    image: lumbre-mcp:latest
    container_name: lumbre-mcp
    restart: unless-stopped
    environment:
      PORT: '8787'
      LUMBRE_BASE_URL: 'https://app.lumbre.pro'
      LUMBRE_APP_BASE_URL: 'https://app.lumbre.pro'
      # Secreto dedicado al backchannel Lumbre<->MCP. Compose aborta antes de
      # crear el contenedor si falta; debe coincidir con el del contenedor Lumbre.
      LUMBRE_MCP_BACKCHANNEL_SECRET: '${LUMBRE_MCP_BACKCHANNEL_SECRET:?define LUMBRE_MCP_BACKCHANNEL_SECRET (minimo 32 caracteres)}'
      # La huella de notas y el store OAuth se escriben bajo
      # `XDG_STATE_HOME/lumbre-mcp`. El volumen es obligatorio: conserva la
      # clave AES-256-GCM estable, los grants y la rotación de refresh tokens
      # entre reinicios, además de `notes-seen.json`. El proceso crea el
      # directorio con 0700 y los ficheros OAuth con 0600.
      #
      # ⚠️ La huella NO está segmentada por token: es un solo fichero para todo
      # el contenedor. Hoy da igual (un único usuario, el token de David), pero
      # si este endpoint llega a servir a más de una persona hay que meter el
      # hash del token en la clave ANTES, o cada uno marcaría como vistas las
      # notas del otro.
      XDG_STATE_HOME: /state
      # NO hay un `LUMBRE_TOKEN` global aquí. La credencial dedicada del
      # backchannel se persiste cifrada por grant; el bearer OAuth
      # opaco se resolverá localmente y no se reenviará a Lumbre.
    volumes:
      - state:/state
    networks:
      - edge
    healthcheck:
      # `/readyz` valida que store, clave y grants OAuth se pueden leer y
      # descifrar. Deduplica concurrencia y cachea 5 s; Caddy no la publica.
      # `/healthz` queda como liveness barato.
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8787/readyz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  state:

networks:
  edge:
    external: true
    name: edge
